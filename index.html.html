<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Cuotas - Club Deportivo Kamuk</title>
    <!-- Tailwind CSS desde CDN para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- ENCABEZADO -->
        <header class="bg-blue-900 text-white p-6 rounded-xl shadow-md flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold">Club Deportivo Kamuk</h1>
                <p class="text-blue-200 text-sm">Control e Historial de Cuotas Sociales</p>
            </div>
            <button onclick="abrirModalJugador()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow transition">
                + Nuevo Jugador
            </button>
        </header>

        <!-- FILTROS Y CONTROLES -->
        <div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap gap-4 items-center justify-between">
            <div class="flex gap-2 items-center">
                <label class="font-semibold text-gray-700">Categoría:</label>
                <select id="filtroCategoria" onchange="renderizar()" class="border rounded-lg p-2 bg-gray-50">
                    <option value="TODAS">Todas las categorías</option>
                    <option value="C7">C7</option>
                    <option value="C9">C9</option>
                    <option value="C11">C11</option>
                    <option value="C13">C13</option>
                    <option value="C15">C15</option>
                    <option value="C17">C17</option>
                    <option value="C20">C20</option>
                    <option value="Primera">Primera</option>
                </select>
            </div>
            <div class="flex gap-2 items-center">
                <label class="font-semibold text-gray-700">Mes:</label>
                <select id="filtroMes" onchange="renderizar()" class="border rounded-lg p-2 bg-gray-50">
                    <option value="Enero">Enero</option>
                    <option value="Febrero">Febrero</option>
                    <option value="Marzo">Marzo</option>
                    <option value="Abril">Abril</option>
                    <option value="Mayo">Mayo</option>
                    <option value="Junio">Junio</option>
                    <option value="Julio" selected>Julio</option>
                    <option value="Agosto">Agosto</option>
                    <option value="Septiembre">Septiembre</option>
                    <option value="Octubre">Octubre</option>
                    <option value="Noviembre">Noviembre</option>
                    <option value="Diciembre">Diciembre</option>
                </select>
            </div>
        </div>

        <!-- TABLA DE JUGADORES -->
        <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-sm">
                        <th class="p-3">Jugador</th>
                        <th class="p-3">Categoría</th>
                        <th class="p-3">Tutor / Teléfono</th>
                        <th class="p-3">Estado Mes</th>
                        <th class="p-3 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaJugadores" class="divide-y divide-gray-100 text-sm">
                    <!-- Carga dinámica -->
                </tbody>
            </table>
        </div>

    </div>

    <!-- MODAL NUEVO JUGADOR -->
    <div id="modalJugador" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-4">
            <h3 class="text-lg font-bold text-gray-800">Cargar Nuevo Jugador</h3>
            <input type="text" id="nombreJugador" placeholder="Nombre y Apellido" class="w-full border p-2 rounded-lg">
            <select id="categoriaJugador" class="w-full border p-2 rounded-lg">
                <option value="C7">C7</option>
                <option value="C9">C9</option>
                <option value="C11">C11</option>
                <option value="C13">C13</option>
                <option value="C15">C15</option>
                <option value="C17">C17</option>
                <option value="C20">C20</option>
                <option value="Primera">Primera</option>
            </select>
            <input type="text" id="tutorJugador" placeholder="Nombre Responsable / Tutor" class="w-full border p-2 rounded-lg">
            <input type="tel" id="telJugador" placeholder="Teléfono de Contacto" class="w-full border p-2 rounded-lg">
            <div class="flex justify-end gap-2">
                <button onclick="cerrarModalJugador()" class="px-4 py-2 border rounded-lg">Cancelar</button>
                <button onclick="guardarJugador()" class="px-4 py-2 bg-blue-900 text-white rounded-lg">Guardar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA -->
    <script>
        let jugadores = JSON.parse(localStorage.getItem('kamuk_jugadores')) || [];
        let pagos = JSON.parse(localStorage.getItem('kamuk_pagos')) || {};

        function guardarDatos() {
            localStorage.setItem('kamuk_jugadores', JSON.stringify(jugadores));
            localStorage.setItem('kamuk_pagos', JSON.stringify(pagos));
        }

        function abrirModalJugador() { document.getElementById('modalJugador').classList.remove('hidden'); }
        function cerrarModalJugador() { document.getElementById('modalJugador').classList.add('hidden'); }

        function guardarJugador() {
            const nombre = document.getElementById('nombreJugador').value.trim();
            const categoria = document.getElementById('categoriaJugador').value;
            const tutor = document.getElementById('tutorJugador').value.trim();
            const tel = document.getElementById('telJugador').value.trim();

            if (!nombre) return alert("Ingresa el nombre del jugador");

            const nuevo = { id: Date.now(), nombre, categoria, tutor, tel };
            jugadores.push(nuevo);
            guardarDatos();
            cerrarModalJugador();
            
            document.getElementById('nombreJugador').value = '';
            document.getElementById('tutorJugador').value = '';
            document.getElementById('telJugador').value = '';
            
            renderizar();
        }

        function registrarPago(idJugador) {
            const mes = document.getElementById('filtroMes').value;
            const clave = `${idJugador}_${mes}`;
            
            pagos[clave] = !pagos[clave];
            guardarDatos();
            renderizar();
        }

        function eliminarJugador(id) {
            if (confirm("¿Estás seguro de eliminar este jugador?")) {
                jugadores = jugadores.filter(j => j.id !== id);
                guardarDatos();
                renderizar();
            }
        }

        function renderizar() {
            const catFiltro = document.getElementById('filtroCategoria').value;
            const mesFiltro = document.getElementById('filtroMes').value;
            const lista = document.getElementById('listaJugadores');
            
            lista.innerHTML = '';

            const filtrados = jugadores.filter(j => catFiltro === 'TODAS' || j.categoria === catFiltro);

            if (filtrados.length === 0) {
                lista.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No hay jugadores registrados en esta categoría.</td></tr>`;
                return;
            }

            filtrados.forEach(j => {
                const clavePago = `${j.id}_${mesFiltro}`;
                const estaPagado = pagos[clavePago];

                const fila = document.createElement('tr');
                fila.className = "hover:bg-gray-50";
                fila.innerHTML = `
                    <td class="p-3 font-semibold text-gray-800">${j.nombre}</td>
                    <td class="p-3"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">${j.categoria}</span></td>
                    <td class="p-3 text-gray-600">${j.tutor || '-'} <br> <span class="text-xs text-gray-400">${j.tel || ''}</span></td>
                    <td class="p-3">
                        ${estaPagado 
                            ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">✓ Pagado (${mesFiltro})</span>`
                            : `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">✕ Pendiente</span>`
                        }
                    </td>
                    <td class="p-3 text-center space-x-2">
                        <button onclick="registrarPago(${j.id})" class="px-3 py-1 text-xs rounded text-white ${estaPagado ? 'bg-orange-500 hover:bg-orange-600' : 'bg-green-600 hover:bg-green-700'}">
                            ${estaPagado ? 'Marcar Pendiente' : 'Registrar Pago'}
                        </button>
                        <button onclick="eliminarJugador(${j.id})" class="px-2 py-1 text-xs bg-gray-200 text-red-600 rounded hover:bg-red-100">✕</button>
                    </td>
                `;
                lista.appendChild(fila);
            });
        }

        renderizar();
    </script>
</body>
</html>
